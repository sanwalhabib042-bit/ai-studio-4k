<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnliImages - AI Studio 4K</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #0f172a; 
            color: #e2e8f0; 
            text-align: center;
        }
        h1 { color: #38bdf8; margin-bottom: 30px; }
        .container { 
            background: #1e293b; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            margin-bottom: 30px;
        }
        input { 
            width: 70%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
            background: #0f172a; 
            color: white; 
            margin-right: 10px;
            outline: none;
        }
        button { 
            padding: 12px 25px; 
            background: #38bdf8; 
            color: #0f172a; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s;
        }
        button:hover { background: #7dd3fc; }
        img, video { 
            max-width: 100%; 
            border-radius: 10px; 
            margin-top: 20px; 
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2); 
            display: none; /* Hidden by default */
        }
        .loading { color: #38bdf8; margin-top: 15px; display: none; font-size: 0.9em; }
        .note { font-size: 0.8em; color: #94a3b8; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🎨 UnliImages AI Studio 4K</h1>

    <!-- TEXT TO IMAGE SECTION -->
    <div class="container">
        <h2>Text to Image (Unlimited)</h2>
        <input type="text" id="img-prompt" placeholder="Example: A futuristic city in Pakistan...">
        <button onclick="generateImage()">Generate Image</button>
        <p class="loading" id="img-loading">Generating high-quality image...</p>
        <img id="result-image" src="" alt="AI Generated Image">
    </div>

    <!-- TEXT TO VIDEO SECTION -->
    <div class="container">
        <h2>Text to Video (Free Tier)</h2>
        <input type="text" id="vid-prompt" placeholder="Example: A cat flying in space...">
        <button onclick="generateVideo()">Generate Video</button>
        <p class="loading" id="vid-loading">Processing video (this may take a minute)...</p>
        <video id="result-video" controls></video>
        <p class="note">Note: Video requires a free Hugging Face Token in code.</p>
    </div>

    <script>
        // --- IMAGE GENERATION (Pollinations.ai - No Key Needed) ---
        function generateImage() {
            const prompt = document.getElementById('img-prompt').value;
            const img = document.getElementById('result-image');
            const loader = document.getElementById('img-loading');
            
            if(!prompt) return alert("Please write something first!");
            
            loader.style.display = 'block';
            img.style.display = 'none';
            
            // Random seed ensures a new image every time
            const seed = Math.floor(Math.random() * 100000);
            
            // Using Pollinations API for unlimited free images
            img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${seed}&nologo=true`;
            
            img.onload = () => {
                loader.style.display = 'none';
                img.style.display = 'block';
            };
        }

        // --- VIDEO GENERATION (Hugging Face API) ---
        async function generateVideo() {
            const prompt = document.getElementById('vid-prompt').value;
            const video = document.getElementById('result-video');
            const loader = document.getElementById('vid-loading');
            
            if(!prompt) return alert("Please write a video prompt!");
            
            loader.style.display = 'block';
            video.style.display = 'none';

            // IMPORTANT: Replace this with your own free token from huggingface.co/settings/tokens
            // If you don't have one, the video part won't work, but images will still work!
            const HF_TOKEN = "hf_YOUR_FREE_TOKEN_HERE"; 

            try {
                const response = await fetch(
                    "https://api-inference.huggingface.co/models/damo-vilab/text-to-video-ms-1.7b",
                    {
                        headers: { 
                            Authorization: `Bearer ${HF_TOKEN}`, 
                            "Content-Type": "application/json" 
                        },
                        method: "POST",
                        body: JSON.stringify({ inputs: prompt }),
                    }
                );
                
                if (!response.ok) throw new Error("Failed to generate. Check token or try again later.");
                
                const blob = await response.blob();
                video.src = URL.createObjectURL(blob);
                video.style.display = 'block';
                video.play();
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
